<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exemplo de card semântico — demonstração</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 2rem; background: #f8f7fa; color: #251b30; }
    .card { max-width: 36rem; padding: 1.5rem; border: 1px solid #d6d0dc; border-radius: 1rem; background: white; }
    a { color: #45236b; text-underline-offset: .2em; }
    a:focus-visible { outline: 3px solid #7a42ba; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <article class="card" aria-labelledby="card-title">
      <h1 id="card-title">Exemplo de auditoria técnica</h1>
      <p>Componente demonstrativo com hierarquia de títulos e link identificável.</p>
      <a href="https://example.org/">Visitar página de exemplo</a>
    </article>
  </main>
</body>
</html>
